<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-labelledby="banner-light-title">
  <title id="banner-light-title">ValiantUI Compose Banner (Light)</title>
  <defs>
    <linearGradient id="bg-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F4F4F5" />
    </linearGradient>
    <linearGradient id="symbol-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0485F7" />
      <stop offset="100%" stop-color="#006FEE" />
    </linearGradient>
    <filter id="subtle-shadow-light" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0485F7" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="440" rx="16" fill="url(#bg-grad-light)" />
  <rect width="1280" height="440" rx="16" fill="none" stroke="#E4E4E7" stroke-width="1.5" />

  <!-- Centered Lockup Group -->
  <g transform="translate(180, 110)">
    <!-- Symbol -->
    <g transform="translate(0, 0) scale(0.85)" filter="url(#subtle-shadow-light)">
      <path fill="url(#symbol-grad-light)" d="M 68 44 L 96 44 L 128 163 L 160 44 L 188 44 L 212 68 L 128 213 L 44 68 Z" />
      <path fill="#7828C8" d="M 128 50 L 136 80 L 128 110 L 120 80 Z" />
    </g>

    <!-- Typography -->
    <g transform="translate(230, 20)">
      <text x="0" y="96" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="92" font-weight="800" letter-spacing="-1.5" fill="#18181B">Valiant<tspan fill="#0485F7">UI</tspan></text>
      <text x="6" y="140" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="600" letter-spacing="8" fill="#71717A">COMPOSE MULTIPLATFORM</text>
    </g>
  </g>

  <!-- Subtitle and Badges -->
  <text x="640" y="348" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400" fill="#52525B">A modern UI design system and component library inspired by HeroUI</text>

  <!-- Platform Pills -->
  <g transform="translate(420, 376)">
    <rect x="0" y="0" width="80" height="28" rx="14" fill="#FFFFFF" stroke="#E4E4E7" />
    <text x="40" y="18" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#27272A">Android</text>

    <rect x="92" y="0" width="60" height="28" rx="14" fill="#FFFFFF" stroke="#E4E4E7" />
    <text x="122" y="18" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#27272A">iOS</text>

    <rect x="164" y="0" width="84" height="28" rx="14" fill="#FFFFFF" stroke="#E4E4E7" />
    <text x="206" y="18" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#27272A">Desktop</text>

    <rect x="260" y="0" width="94" height="28" rx="14" fill="#FFFFFF" stroke="#E4E4E7" />
    <text x="307" y="18" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#27272A">Web Wasm</text>

    <rect x="366" y="0" width="76" height="28" rx="14" fill="#F5F3FF" stroke="#DDD6FE" />
    <text x="404" y="18" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#7828C8">Kotlin</text>
  </g>
</svg>