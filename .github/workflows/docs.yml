name: Deploy Documentation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build WebAssembly (Wasm) Distribution
        run: ./gradlew :webApp:wasmJsBrowserDistribution --no-daemon

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build documentation with Zensical
        run: uvx zensical build --clean

      - name: Deploy Compose Web Wasm to site
        run: |
          mkdir -p site/compose
          cp -r webApp/build/dist/wasmJs/productionExecutable/* site/compose/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
